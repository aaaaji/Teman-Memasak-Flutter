name: gameatlas
version: 1.0.0+1
description: Aplikasi katalog game Flutter untuk tugas Mobile Programming. Data JSON lokal dan gambar cover Steam online.
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/games.json
